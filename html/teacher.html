<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Teacher Dashboard</title>
        <meta charset="UTF-8" >
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta description="Author" content="Mr_Tawiah">
        <meta http-equiv="X-UA-Compatible" content="ie=edge">

<script>
        //check for token
        const token=localStorage.getItem("token");
        if(!token){
            alert("Please login in with your credentials to access the page!");
            window.location.href="signin.html";
        }
        const user_role=JSON.parse(atob(token.split('.')[1]));
        alert(user_role.role);
        if(user_role.role!=="teacher"){
            alert("You are not authorized to access this page!");
            window.location.href="signin.html";
        }
    </script>

        <link rel="stylesheet" href="css/main.css">
        <link rel="stylesheet" href="css/teacher.css">
    </head>
    <body>
        <header>
            <div class="logoinfo">
                <img class="logo" src="images/K_TAwiah_LOgo.png" alt="K_Tawiah Logo"/>
                <h1 class="title">K_Tawiah Virtual Classroom</h1>
                <p class="details">
                    <span class="welcome">Welcome to  teacher dashboard!</span>
                    <br/>
                </p>
                </div>


    </body>
</html>
