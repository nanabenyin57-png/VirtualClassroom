<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Teacher Dashboard</title>
        <meta charset="UTF-8" >
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta description="Author" content="Mr_Tawiah">
        <meta http-equiv="X-UA-Compatible" content="ie=edge">

<script>
        //check for token
        const token=localStorage.getItem("token");
        if(!token){
            alert("Please login in with your credentials to access the page!");
            window.location.href="signin.html";
        }
        const user_role=JSON.parse(atob(token.split('.')[1]));
        alert(user_role.role);
        if(user_role.role!=="teacher"){
            alert("You are not authorized to access this page!");
            window.location.href="signin.html";
        }
    </script>

        <link rel="stylesheet" href="css/main.css">
        <link rel="stylesheet" href="css/teacher.css">
    </head>
    <body>
        <header>
            <div class="logoinfo">
                <img class="logo" src="images/K_TAwiah_LOgo.png" alt="K_Tawiah Logo"/>
                <h1 class="title">K_Tawiah Virtual Classroom</h1>
                <p class="details">
                    <span class="welcome">Welcome to  teacher dashboard!</span>
                    <br/>
                </p>
                </div>
                </header>

                <section class="overview" id="dashboard">
                    <div class="overviewclass" id="classset">
                        <h1 class="overviewheading">CLASSES</h1>
                        <!--To trigger the class list and activity-->
                        <button class="buttons1" id="JHS1">JHS1</button>  
                        <button class="buttons2" id="JHS2">JHS2</button>
                        <button class="buttons3" id="JHS3">JHS3</button>
                        <pre class="classinfo" id="classcontent">
                            <!--Class names and activities come up here.-->
                        </pre>
                    </div>
                    <div class="profile" id="teacherprofile">
                        <h1>PROFILE</h1>
                        <p>
                            <!--the teache profile info comes here and it enables change of password-->
                        </p>
                    </div>
                    <div class="courses" id="courseslist">
                        <h1>COURSES</h1>
                        <p class="courses">
                            <!-- This space would be reserved for course outline, upcoming classes and course related materials-->

                        </p>
                    </div>
                    <div class="assignment" id="assignmentcard">
                        <button id="giveassignment">  Give Assignment</button>

                     <pre class="showassignment"  id="assignmentgiven">
                        <textarea class="assignmentarea"  id="assignmenttextarea">
                            Please enter the assignment here.
                        </textarea>

                     </pre>
                    </div>


                </section>


    </body>
</html>
