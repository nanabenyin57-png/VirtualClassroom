<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <meta name="authorr" content="Mr_Tawiah">
    <title>K_Tawiah Virtual Classroom Signup</title>
    <link rel="stylesheet" href="css/signup.css">
    <link rel="stylesheet" href="css/main.css">
    <link rel="shortcut icon" href="#">
    </head>
    <body>
        <header>
            <div class="logoinfo">
                <img class="logo" src=" ../html/images/K_TAwiah_LOgo.png" alt="K_Tawiah Logo"/>
                <h1 class="title">K_Tawiah Virtual Classroom</h1>
                <p class="details">
                    <span class="welcome">Welcome to the virtual classroom!</span>
                </p>
            </div>
        </header>
            <section class="signup" id="sign-up">
              <select id="role" name="select_role" class="roleselector">
                <option value="select_role" selected>Select a role </option>
                <option value="student">Student</option>
                <option value="teacher">Teacher</option>
              </select>  
               <button id="role_selector" class="rolebutton">Select</button>
                <form id="registrationform" class="signupform">
                    <label for="first-name">First name</label>
                    <input type="text" id="first-name" name="firstname" autocomplete="given-name" required/>
                    <label for="middle-name"> Middle name</label>
                    <input type="text" id="middle-name" name="middlename" autocomplete="additional-name"/>
                    <label for="last-name">Last name</label>
                    <input type="text" id="last-name" name="lastname" autocomplete="family-name" required/>
                    <label for="e-mail">Email</label>
                    <input type="email" id="e-mail" name="email" autocomplete="email" required/>
                    <label for="user-password">Password</label>
                    <input type="password" id="user-password" name="password" autocomplete="new-password" required/>
                    <label for="confirmpassword">Confirm Password</label>
                    <input type="password" id="confirmpassword" name="confirm-password" autocomplete="new-password" required/>
                    <label for="user-name">Username</label>
                    <input type="text" id="user-name" name="username" autocomplete="username" required/>
                    <label for="userrole">Role</label>
                    <input type="text" id="userrole" name="role">
                    <label for="class" id="classhead">CLASS</label>
                    <select id="_class" name="class" class="roleselector">
                        <option value="select_class" selected>Select a class </option>
                        <option value="jhs1">JHS 1</option>
                        <option value="jhs2">JHS 2</option>
                        <option value="jhs3">JHS 3</option>
                    </select>
                    <button type="submit" id="signup-btn" class="signupbtn">Sign Up</button>
                </form>
            </section>
        <script src="js/signup.js"></script>
        </body>
