<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <meta name="authorr" content="Mr_Tawiah">
    <title>K_Tawiah Virtual Classroom</title>
    <link rel="stylesheet" href="css/index.css">
    <link rel="stylesheet" href="css/main.css">
    <link rel="shortcut icon" href="#">
    </head>
    <body>
        <header>
            <div class="logoinfo">
                <img class="logo" src=" ../html/images/K_TAwiah_LOgo.png" alt="K_Tawiah Logo"/>
                <h1 class="title">K_Tawiah Virtual Classroom</h1>
                <p class="details">
                    <span class="welcome">Welcome to the virtual classroom!</span>
                    <br/>
                </p>
            </div>
        </header>
        <section class="add-notes">
            <h2 class="add">
                ADD NOTES
            </h2>
             <form id="addnotes" class="add_notes">
                <label for="title">Title:</label>
                <input type="text" id="title" name="title" required>
                <br/>
                <br/>
                <label for="content">Content:</label>
                <textarea id="content" name="content" rows="4" required></textarea>
                <br/>
                <button type="submit" class="add-button">Add Note</button>
        </section>
        <script src="js/admin.js"></script>
    </body>
</html>
