<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <meta name="authorr" content="Mr_Tawiah">
    <title>K_Tawiah Sign In</title>
    <link rel="stylesheet" href="css/signin.css">
    <link rel="stylesheet" href="css/main.css">
    <link rel="shortcut icon" href="#">
    </head>
    <body>
        <header>
            <div class="logoinfo">
                <img class="logo" src=" ../html/images/K_TAwiah_LOgo.png" alt="K_Tawiah Logo"/>
                <h1 class="title">K_Tawiah Virtual Classroom</h1>
                <p class="details">
                    <span class="welcome">Welcome to the virtual classroom sign in page!</span>
                    <br/>
                </p>
            </div>
        </header>
        <section class="signin-section">
            <h2 class="sign_in">Sign In</h2>
            <br/>
            <form id="signin" class="user-signin">
                <label for="email">Email:</label>
                <input type="email" id="email" name="e-mail" required>
                <label for="password">Password:</label>
                <input type="password" id="password" name="pass-word" required>
                <button type="submit" class="signin-button">Sign In</button>
            </form>
            <script src="js/signin.js"></script>
        </section>
    </body>
    </html>
